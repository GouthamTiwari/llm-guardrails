# Default policy (docs/SPEC.md 9.1). Every value here has a "why" in the spec.
name: default
version: 1

limits:
  max_input_chars: 8000      # bounds cost and regex time
  max_context_docs: 20
  max_doc_chars: 20000
  max_output_tokens: 1024

topics:
  mode: allow_all
  allowed: []
  min_keyword_hits: 1

denied_actions:              # regexes on the scan text; a match blocks the request
  - '\bdrop\s+table\b'
  - '\btruncate\s+table\b'
  - '\brm\s+-rf\b'
  - '\b(transfer|send|pay)\b.{0,40}\bwithout\b.{0,20}\b(confirm|confirmation|asking|approval|otp)\b'

tools:
  risky: []

pii:
  min_confidence: 0.6
  entities:
    AADHAAR:     {input: redact, output: redact}
    PAN:         {input: redact, output: redact}
    CREDIT_CARD: {input: block,  output: block}   # no chat flow should ever handle a card
    PHONE_IN:    {input: redact, output: redact}
    EMAIL:       {input: redact, output: redact}
    UPI_ID:      {input: redact, output: redact}
    GSTIN:       {input: allow,  output: allow}   # printed on every invoice, publicly searchable
    IFSC:        {input: allow,  output: allow}   # identifies a bank branch, not a person
  restore: []

injection:
  use_embeddings: true
  use_llm: true

context:
  on_injection: strip_line
  llm_classifier: false

schema:
  max_retries: 2

grounding:
  enabled: true
  mode: reject
  entailment: "off"
  min_overlap: 0.8   # dev sweep, reports/grounding_operating_point.json (Task 20)

leak:
  allowed_domains: []
  max_query_chars: 30

timeouts_s: {}
fail_mode: {}
